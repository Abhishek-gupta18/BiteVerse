<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = '<pre style="padding:16px;white-space:pre-wrap;color:#b91c1c;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;margin:16px;">' +
          String(event.error && event.error.stack ? event.error.stack : event.message || 'Unknown startup error') +
          '</pre>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = '<pre style="padding:16px;white-space:pre-wrap;color:#b91c1c;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;margin:16px;">' +
          String(event.reason && event.reason.stack ? event.reason.stack : event.reason || 'Unknown startup rejection') +
          '</pre>';
      });
    </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
